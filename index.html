<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore plants and discover their scientific names and families."
    />
    <title>Plant Explorer</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        color: #26352d;
        background: #f6f2e9;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        padding: 48px 20px;
        background:
          radial-gradient(ellipse at 12% 18%, #e8eddb 0, transparent 32%),
          radial-gradient(ellipse at 90% 85%, #f0dfd1 0, transparent 30%),
          #f6f2e9;
      }

      .page {
        width: min(100%, 1000px);
        margin: 0 auto;
      }

      .brand {
        margin: 0 0 12px;
        color: #52725c;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.5rem, 7vw, 4rem);
        font-weight: 500;
        letter-spacing: -0.055em;
        line-height: 1;
      }

      .intro {
        margin: 12px 0 24px;
        color: #68766c;
        font-size: 1.05rem;
      }

      .sr-only {
        position: absolute;
        overflow: hidden;
        width: 1px;
        height: 1px;
        padding: 0;
        border: 0;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      .search-form {
        display: flex;
        gap: 10px;
        margin-bottom: 24px;
      }

      .search-form input {
        flex: 1;
        min-width: 0;
        padding: 12px 16px;
        border: 1px solid #d5dccf;
        border-radius: 999px;
        background: #fffdf8;
        color: inherit;
        font: inherit;
      }

      .search-form input:focus-visible,
      button:focus-visible {
        outline: 3px solid #bc7653;
        outline-offset: 3px;
      }

      button {
        padding: 12px 20px;
        border: 0;
        border-radius: 999px;
        color: #fffdf8;
        background: #52725c;
        box-shadow: 0 8px 18px rgb(82 114 92 / 22%);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition:
          background 150ms ease,
          transform 150ms ease;
      }

      button:hover:not(:disabled) {
        transform: translateY(-2px);
        background: #3f6049;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      #status {
        min-height: 1.5em;
        margin: 0 0 14px;
        color: #68766c;
        font-size: 0.95rem;
      }

      .plant-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
        gap: 18px;
      }

      .plant-card {
        overflow: hidden;
        border: 1px solid rgb(38 53 45 / 8%);
        border-radius: 20px;
        background: #fffdf8;
        box-shadow: 0 16px 38px rgb(38 53 45 / 9%);
      }

      .plant-image,
      .image-placeholder {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        background: #e9e8dc;
      }

      .image-placeholder {
        display: grid;
        place-items: center;
        color: #52725c;
        font-size: 2rem;
      }

      .plant-info {
        padding: 16px;
      }

      .plant-family {
        margin: 0 0 6px;
        color: #8b9589;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .plant-name {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.35rem;
        font-weight: 500;
      }

      .plant-scientific-name {
        margin: 6px 0 0;
        color: #68766c;
        font-size: 0.95rem;
        font-style: italic;
      }

      @media (max-width: 520px) {
        body {
          padding: 32px 16px;
        }

        .search-form {
          align-items: stretch;
          flex-direction: column;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <p class="brand">Discover the botanical world</p>
      <h1>Plant Explorer</h1>
      <p class="intro">Search plants by common or scientific name.</p>

      <form class="search-form" id="search-form">
        <label class="sr-only" for="plant-query">Plant name</label>
        <input
          id="plant-query"
          name="q"
          type="search"
          maxlength="100"
          placeholder="Try rose, fern, or aloe..."
        />
        <button id="search-button" type="submit">Search plants</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>
      <section
        id="plants"
        class="plant-grid"
        aria-label="Plant search results"
      ></section>
    </main>

    <script>
      const searchForm = document.querySelector("#search-form");
      const searchInput = document.querySelector("#plant-query");
      const searchButton = document.querySelector("#search-button");
      const status = document.querySelector("#status");
      const plantGrid = document.querySelector("#plants");

      function createPlantCard(plant) {
        const card = document.createElement("article");
        card.className = "plant-card";

        if (typeof plant.image_url === "string") {
          try {
            const imageUrl = new URL(plant.image_url);
            if (imageUrl.protocol === "https:") {
              const image = document.createElement("img");
              image.className = "plant-image";
              image.src = imageUrl.href;
              image.alt = plant.common_name || plant.scientific_name || "Plant";
              image.loading = "lazy";
              image.addEventListener("error", () => {
                const placeholder = document.createElement("div");
                placeholder.className = "image-placeholder";
                placeholder.setAttribute("aria-hidden", "true");
                placeholder.textContent = "❧";
                image.replaceWith(placeholder);
              }, { once: true });
              card.append(image);
            }
          } catch {
            // Use the placeholder when Trefle has no usable image URL.
          }
        }

        if (!card.querySelector("img")) {
          const placeholder = document.createElement("div");
          placeholder.className = "image-placeholder";
          placeholder.setAttribute("aria-hidden", "true");
          placeholder.textContent = "❧";
          card.append(placeholder);
        }

        const info = document.createElement("div");
        info.className = "plant-info";

        const family = document.createElement("p");
        family.className = "plant-family";
        family.textContent = plant.family_common_name || "Plant family";

        const name = document.createElement("h2");
        name.className = "plant-name";
        name.textContent = plant.common_name || plant.scientific_name || "Unknown plant";

        const scientificName = document.createElement("p");
        scientificName.className = "plant-scientific-name";
        scientificName.textContent = plant.scientific_name || "";

        info.append(family, name, scientificName);
        card.append(info);
        return card;
      }

      async function loadPlants(query = "") {
        searchButton.disabled = true;
        status.textContent = "Loading plants...";
        plantGrid.replaceChildren();

        try {
          const url = new URL("/api/plants", window.location.origin);
          if (query) {
            url.searchParams.set("q", query);
          }

          const response = await fetch(url);
          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.message || "The plant service returned an error.");
          }

          if (!Array.isArray(result.data)) {
            throw new Error("The plant service returned an unexpected response.");
          }

          if (result.data.length === 0) {
            status.textContent = "No plants found. Try another search.";
            return;
          }

          plantGrid.append(...result.data.map(createPlantCard));
          status.textContent = `Showing ${result.data.length} plant${result.data.length === 1 ? "" : "s"}.`;
        } catch (error) {
          status.textContent = `Could not load plants: ${error.message}`;
        } finally {
          searchButton.disabled = false;
        }
      }

      searchForm.addEventListener("submit", (event) => {
        event.preventDefault();
        loadPlants(searchInput.value.trim());
      });

      loadPlants();
    </script>
  </body>
</html>
